[project]
name = "brandlyposter-labs"
version = "0.1.0"
description = "MCP-Controlled Poster Studio — iconic movie posters with exact likeness, systematic QA (earring symmetry fix), and print/social export specs"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30.0",
    "Pillow>=10.0.0",
    "torch>=2.0.0",
    "transformers>=5.0.0",
    "sentence-transformers>=6.0.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.11.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
